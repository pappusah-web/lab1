<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cart-container">
        <h2>Your Shopping Cart</h2>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Book Image</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="Book/cse images.jpg" alt="Book Image" class="book-img"></td>
                    <td>Computer Science</td>
                    <td>Robert Sedgewick</td>
                    <td>Rs. 4000</td>
                    <td> <div class="amount-box">
                            <button class="amount-btn">-</button>
                            <span class="amount-value">2</span>
                            <button class="amount-btn">+</button>
                        </div>
                    </td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
                <tr>
                    <td><img src="Book/Ai book.jpg" alt="Book Image" class="book-img"></td>
                    <td>Artificial Intelligence</td>
                    <td>Charu C. Agarwal</td>
                    <td>Rs. 5000</td>
                    <td>
                        <div class="amount-box">
                            <button class="amount-btn">-</button>
                            <span class="amount-value">1</span>
                            <button class="amount-btn">+</button>
                        </div>
                    </td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <!-- Total Price Section -->
        <div class="total-section">
            <p>Total Price: Rs. 13,000</p>
        </div>

       
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>
</body>
</html>
