<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalogue-container">
        <h2>ECE Books Catalogue</h2>
        <table class="catalogue-table">
            <thead>
                <tr>
                    <th>Book Image</th>
                    <th>Book Name</th>
                    <th>Author Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="Book/Digital elctronics.jpg" alt="Book Image" class="book-img"></td>
                    <td>Digital Electronics</td>
                    <td>Rishab Anand</td>
                    <td>Rs. 2600</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                   <td><img src="Book/Signal and system.jpg" alt="Book Image" class="book-img"></td>
                    <td>Signal and systems</td>
                    <td>Tarun Kumar Rawat</td>
                    <td>Rs. 3500</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="Book/Comm. Engg.jpg" alt="Book Image" class="book-img"></td>
                    <td>Communicational Engineering</td>
                    <td>U.A Bakshi</td>
                    <td>Rs. 2000</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
            </tbody>
        </table>
        <p class="note">Select a category from the left panel to view more.</p>
    </div>
</body>
</html>
