<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalogue-container">
        <h2>CSE Books Catalogue</h2>
        <table class="catalogue-table">
            <thead>
                <tr>
                    <th>Book Image</th>
                    <th>Book Name</th>
                    <th>Author Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="Book/cse images.jpg" alt="Book Image" class="book-img"></td>
                    <td>Computer Science</td>
                    <td>Robert Sedgewick</td>
                    <td>Rs. 4000</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="Book/Operating system.jpg" alt="Book Image" class="book-img"></td>
                    <td>Operating System Concepts</td>
                     <td>Dr. Ikvinderpal Singh</td>
                    <td>Rs. 3800</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                    <td><img src="Book/Database system concepts.jpg" alt="Book Image" class="book-img"></td>
                    <td>Database System Concepts</td>
                     <td>Abraham silberschatz</td>
                    <td>Rs. 2500</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
            </tbody>
        </table>
        <p class="note">Select a category from the left panel to view more.</p>
    </div>
</body>
</html>
