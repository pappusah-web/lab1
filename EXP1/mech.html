<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalogue-container">
        <h2>Mechanical Books Catalogue</h2>
        <table class="catalogue-table">
            <thead>
                <tr>
                    <th>Book Image</th>
                    <th>Book Name</th>
                    <th>Author Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="Book/Mechanical book.jpg" alt="Book Image" class="book-img"></td>
                    <td>Mechanical Engineering</td>
                    <td>Basant Agarwal</td>
                    <td>Rs. 3200</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                     <td><img src="Book/Thermodynamics.jpg" alt="Book Image" class="book-img"></td>
                    <td>Thermodynamics</td>
                    <td>Yunus A. Sangel</td>
                    <td>Rs. 3400</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
                <tr>
                     <td><img src="Book/Fluid Mechanics.jpg" alt="Book Image" class="book-img"></td>
                    <td>Fluid Mechanics</td>
                    <td>C S. Jog</td>
                    <td>Rs. 2300</td>
                    <td><button class="cart-btn">Add to Cart</button></td>
                </tr>
            </tbody>
        </table>
        <p class="note">Select a category from the left panel to view more.</p>
    </div>
</body>
</html>
