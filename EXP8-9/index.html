
<!DOCTYPE html>
<html>
<head>
    <title>CSS Design</title>

    <style>
        /* Different fonts, styles and colors */
        body {
            font-family: Arial, sans-serif;
            color: #222;
            background-image: url("background.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }

        h1 {
            font-family: Georgia, serif;
            color: darkblue;
            text-align: center;
            font-style: italic;
        }

        p {
            font-size: 18px;
            color: darkgreen;
            font-weight: bold;
        }

        /* Background image for a single element */
        .box {
            background-image: url("element.jpg");
            background-repeat: repeat;
            padding: 20px;
            border: 2px solid black;
        }

        /* Styles for links */
        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:active {
            color: red;
        }

        a:hover {
            color: orange;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>
        CSS stands for Cascading Style Sheets.
        It is used to style and design web pages.
    </p>

    <div class="box">
        <h2>CSS Background Image</h2>
        <p>This element has its own background image.</p>
    </div>

    <h2>CSS Links</h2>

    <a href="https://www.google.com">Visit Google</a>
    <br><br>
     <a href="https://www.youtube.com">Visit Youtube</a>
     <br><br>
    <a href="https://www.wikipedia.org">Visit Wikipedia</a>




</body>
</html>
